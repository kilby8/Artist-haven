name: Android CI

on:
  push:
    branches: [ main, 'gauntlet/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build, lint and test
        run: ./gradlew --no-daemon --continue :engine:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artist-haven-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      - name: Upload test reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            engine/build/reports/
            engine/build/test-output/
            app/build/reports/
            app/build/test-output/
          if-no-files-found: ignore

      # Test screenshots and reports also go to a ci-output/<branch> branch, so they can be viewed
      # without downloading artifacts. Only on pushes to this repository.
      - name: Publish test output to a branch
        if: always() && github.event_name == 'push'
        run: |
          out=$(mktemp -d)
          for d in engine/build/test-output app/build/test-output app/build/reports/lint-results-debug.html app/build/test-results; do
            [ -e "$d" ] && mkdir -p "$out/$(dirname $d)" && cp -r "$d" "$out/$d"
          done
          cd "$out"
          git init -q -b output
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "CI output for ${GITHUB_SHA}" || exit 0
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" "output:refs/heads/ci-output/${GITHUB_REF_NAME}"

      # A pre-release with the APK attached gives a plain download link that works on a phone
      # without signing in to GitHub. Replaced on every push to the branch.
      - name: Publish preview APK as a pre-release
        if: success() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="preview-${GITHUB_REF_NAME//\//-}"
          cp app/build/outputs/apk/debug/app-debug.apk artist-haven.apk
          gh release delete "$tag" --yes --cleanup-tag || true
          gh release create "$tag" artist-haven.apk --prerelease --target "$GITHUB_SHA" \
            --title "Artist Haven preview (${GITHUB_REF_NAME})" \
            --notes "Debug build of ${GITHUB_SHA::7}. Download artist-haven.apk on an Android 8+ phone and open it to install."
