<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artist Haven</title>
<meta name="description" content="Artist Haven, a drawing and painting app with real pen pressure.">
<link rel="icon" href="app/icons/icon-192.png" type="image/png">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    background: #1e1e22; color: #ededf0;
  }
  .card { width: min(560px, 100%); background: #26262c; border-radius: 24px; padding: 40px 32px; text-align: center; box-shadow: 0 24px 80px rgba(0,0,0,.4); }
  .logo { width: 96px; height: 96px; border-radius: 24px; display: block; margin: 0 auto 20px; }
  h1 { margin: 0; font-size: 2rem; }
  p { color: #9a9aa3; line-height: 1.5; }
  .btn { display: block; margin: 14px 0 0; padding: 16px 20px; border-radius: 16px; text-decoration: none; font-weight: 600; font-size: 1.05rem; }
  .primary { background: #6fa8ff; color: #0b1b33; }
  .secondary { background: #33333b; color: #ededf0; }
  .btn small { display: block; font-weight: 400; font-size: .85rem; opacity: .75; margin-top: 2px; }
  .footer { margin-top: 26px; font-size: .85rem; }
  .footer a { color: #6fa8ff; text-decoration: none; }
</style>
</head>
<body>
  <main class="card">
    <img class="logo" src="app/icons/icon-192.png" alt="">
    <h1>Artist Haven</h1>
    <p>Draw and paint with real pen pressure: pencils, inks, oils, watercolour, charcoal and more.</p>
    <a class="btn primary" href="app/">Open Artist Haven<small>Windows, Surface Pro, or any computer. Use Edge or Chrome, then choose Install app.</small></a>
    <a class="btn secondary" href="https://github.com/kilby8/Artist-haven/releases/download/preview-main/artist-haven.apk">Download for Android<small>Android 8 or newer</small></a>
    <p class="footer">Source code on <a href="https://github.com/kilby8/Artist-haven" target="_blank" rel="noreferrer">GitHub</a></p>
  </main>
</body>
</html>
